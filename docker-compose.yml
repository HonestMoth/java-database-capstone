services:
  app:
    build: .
    image: smart-clinic-backend:latest
    container_name: smart-clinic
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/cms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_MONGODB_URI: mongodb://host.docker.internal:27017/prescriptions
      JWT_SECRET: smart-clinic-management-system-secret-key-2026
    restart: unless-stopped
