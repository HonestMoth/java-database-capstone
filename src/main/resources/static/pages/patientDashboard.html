<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Patient Dashboard</title>

    <link
        rel="icon"
        href="../assets/images/favicon.ico"
    >

    <link
        rel="stylesheet"
        href="../assets/css/adminDashboard.css"
    >

    <link
        rel="stylesheet"
        href="../assets/css/style.css"
    >

    <link
        rel="stylesheet"
        href="../assets/css/patientDashboard.css"
    >

    <script
        src="../js/render.js"
        defer
    ></script>

    <script
        src="../js/util.js"
        defer
    ></script>

    <script
        src="../js/components/header.js"
        defer
    ></script>

    <script
        src="../js/components/footer.js"
        defer
    ></script>

    <script
        type="module"
        src="../js/components/modals.js"
    ></script>

</head>


<body onload="renderContent()">

    <div class="container">

        <div class="wrapper">

            <!-- Header -->
            <div id="header"></div>


            <!-- Main Content -->
            <main class="main-content">

                <section class="patient-dashboard">

                    <div class="dashboard-header">

                        <h1>
                            Find Your Doctor
                        </h1>

                        <p>
                            Browse doctors and book an appointment.
                        </p>

                    </div>


                    <!-- Search -->
                    <div class="filter-wrapper">

                        <input
                            type="text"
                            id="searchBar"
                            class="searchBar"
                            placeholder="Search doctor by name..."
                        >


                        <!-- Time Filter -->
                        <select
                            class="filter-select"
                            id="filterTime"
                        >

                            <option value="">
                                All Times
                            </option>

                            <option value="AM">
                                AM
                            </option>

                            <option value="PM">
                                PM
                            </option>

                            <option value="09:00-10:00">09:00–10:00</option>
                            <option value="10:00-11:00">10:00–11:00</option>
                            <option value="11:00-12:00">11:00–12:00</option>
                            <option value="12:00-13:00">12:00–13:00</option>
                            <option value="13:00-14:00">13:00–14:00</option>
                            <option value="14:00-15:00">14:00–15:00</option>
                            <option value="15:00-16:00">15:00–16:00</option>
                            <option value="16:00-17:00">16:00–17:00</option>

                        </select>


                        <!-- Specialty Filter -->
                        <select
                            class="filter-select"
                            id="filterSpecialty"
                        >

                            <option value="">
                                All Specialties
                            </option>

                            <option value="Cardiologist">Cardiologist</option>

                            <option value="Dermatologist">Dermatologist</option>

                            <option value="General Medicine">General Medicine</option>

                            <option value="Neurologist">Neurologist</option>

                            <option value="Orthopedist">Orthopedist</option>

                            <option value="Pediatrician">Pediatrician</option>

                            <option value="Psychiatry">Psychiatry</option>

                            <option value="Gynecology">Gynecology</option>

                        </select>

                    </div>


                    <!-- Doctor Cards -->
                    <div id="content">

                        <p class="noDoctorRecord">
                            Loading doctors...
                        </p>

                    </div>

                </section>

            </main>


            <!-- Footer -->
            <div id="footer"></div>

        </div>

    </div>


    <!-- Reusable Modal -->
    <div
        id="modal"
        class="modal"
    >

        <div class="modal-content">

            <span
                class="close"
                id="closeModal"
            >
                &times;
            </span>

            <div id="modal-body"></div>

        </div>

    </div>


    <!-- Patient Dashboard Logic -->
    <script
        type="module"
        src="../js/patientDashboard.js"
    ></script>

</body>

</html>
