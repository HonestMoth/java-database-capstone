# ===============================
# MySQL Database
# ===============================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# MongoDB
# ===============================

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/prescriptions}

# ===============================
# Server
# ===============================

server.port=8080
# ==============================
# Thymeleaf
# ==============================

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8


# ==============================
# Static Resources
# ==============================

spring.web.resources.static-locations=classpath:/static/


api.path=/api/
jwt.secret=smart-clinic-management-system-secret-key-2026
